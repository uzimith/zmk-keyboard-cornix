# User-level config for the cornix board family (left / right / ph_left).
# Resolved by the `cornix` id declared in boards/jzf/cornix/cornix.zmk.yml,
# the same way config/cornix.keymap is.

# Windows regenerates its link key across some reboots and then asks the
# keyboard to pair again. ZMK refuses that by default for an already-bonded
# profile, so the connection is stuck until &bt BT_CLR is pressed by hand.
# This allows overwriting keys from previously paired hosts.
# NOTE: enabling this also turns on Secure Connection passkey entry, and every
# already-paired host has to be paired again once.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Disables 2M PHY, which several Windows Bluetooth adapters handle badly.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Works around a Windows bug with battery level notifications.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
